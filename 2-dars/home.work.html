<!Doctype html>
<html lang="uz">
<head>
 <title>Koinot</title>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="style3.css">
</head>
<body>
    <section>
        <div class="content">
            <h1>Koinot Sirlarini O'rganamiz</h1>
            <p>
               Ushbu loyiha CSS-da HEX, RGB va nomlangan ranglar hamda background-size, 
               background-position xossalari orqali to'liq ekran hajmini egallashni 
               ko'rsatib beradi.
            </p>
            <a href="#" class="btn">Boshlash</a>
        </div>
    </section>
    <!-- 
      background-size: cover — Rasmni blok o'lchamiga moslab shunday kattalashtiradiki, 
      blokda hech qanday bo'sh joy qolmaydi. Rasmning ba'zi qismlari kesilib ketishi mumkin.

      background-size: contain — Rasmni butunlay ko'rinadigan qilib blokga joylashtiradi. 
      Rasm kesilmaydi, lekin blokning ba'zi joylarida bo'sh (ochiq) joylar qolishi mumkin. -->
</body>
</html>
