<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background-color: green;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        header nav {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            background-color: #2DA844;
            border-radius: 50px;
        }

        header h2 {
            color: white;
        } 

        h1 {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .products-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            flex: 1;
            border: 1px solid gainsboro;
            background-color: white;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .card h3 {
            text-align: center;
            margin-bottom: 8px;
        }

        .card p {
            color: #2DA844;
            text-align: center;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .products-list {
                flex-direction: column;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>My shop</h2>
        <nav>
            <a href="#">Katalog</a>
            <a href="#">Aksiyalar</a>
            <a href="#">Savat</a>
        </nav>
    </header>

    <h1>Mahsulotlar</h1>

    <div class="products-list">
        <div class="card">
            <img src="Снимок экрана 2026-09-26 144459.png" alt="">
            <h3>Mahsulot 1</h3>
            <p>45,000 so'm</p>
        </div>

        <div class="card">
            <img src="Снимок экрана 2026-09-26 144459.png" alt="">
            <h3>Mahsulot 2</h3>
            <p>72,000 so'm</p>
        </div>

        <div class="card">
            <img src="Снимок экрана 2026-09-26 144459.png" alt="">
            <h3>Mahsulot 3</h3>
            <p>120,000 so'm</p>
        </div>
    </div>
</body>
</html>
